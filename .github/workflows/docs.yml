name: Docs

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job because the `secrets` context is **not available in a step's
    # `if:`** — only `env` is. Written as a step condition it fails to parse with
    # "Unrecognized named-value: 'secrets'".
    env:
      DOCS_FETCH_TOKEN: ${{ secrets.DOCS_FETCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements-docs.txt

      # The guides come from the code repositories at a pinned ref, so the site is
      # reproducible and nothing here is a copy somebody can quietly edit.
      # `circuless-cloud-beta` is private, and the default GITHUB_TOKEN is scoped to
      # the repository the workflow runs in — so an anonymous clone fails with
      # "could not read Username for 'https://github.com'", which does not read like a
      # permissions problem at all.
      #
      # DOCS_FETCH_TOKEN is a fine-grained PAT with **Contents: Read** on
      # `circuless-cloud-beta` and nothing else. If the secret is absent the clone is
      # anonymous, which is correct for the public repositories and fails clearly for
      # the private one.
      - name: Credential for the private repository
        if: env.DOCS_FETCH_TOKEN != ''
        run: |
          git config --global \
            url."https://x-access-token:${DOCS_FETCH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Fetch the guides
        env:
          CIRCULESS_CLOUD_REF: ${{ vars.CIRCULESS_CLOUD_REF || 'main' }}
          CIRCULESS_NODE_REF: ${{ vars.CIRCULESS_NODE_REF || 'main' }}
        run: ./scripts/fetch-guides.sh

      # `strict: true` in mkdocs.yml turns a broken internal link or a page missing
      # from the nav into a failure. A documentation site's commonest defect is a link
      # to a page that moved, and it is invisible until a reader hits it.
      - name: Build
        run: mkdocs build

      - name: Keep the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 30

  # Publishing is a separate job so that a broken build never replaces a working site,
  # and so the artifact above exists either way.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
        # Creates the Pages site on first run, so nobody has to find the
        # setting. Harmless once it exists.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
